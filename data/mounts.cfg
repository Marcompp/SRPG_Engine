; mounted_class: foot class -> its mounted class (classes not listed can't mount).
; display: what a mounted class is called on each species.
; names: random names for new mounts.

[mounted_class]
"Swordsman"="Equestrian"
"Rogue"="Equestrian"
"Corsair"="Equestrian"
"Performer"="Equestrian"
"Footman"="Cavalry"
"Bannerman"="Cavalry"
"Axeman"="Raider"
"Brigand"="Raider"
"Archer"="Nomad"
"Poacher"="Nomad"
"Mage"="Battlemage"
"Cleric"="Battlemage"
"Swordsmaster"="Gendarme"
"Assassin"="Gendarme"
"Swashbuckler"="Gendarme"
"Hoplite"="Gendarme"
"Berserker"="Warlord"
"Marksman"="Hussar"
"Reaver"="Hussar"
"Sorcerer"="Spellknight"
"Bishop"="Spellknight"

[display]
"Equestrian"={"Horse": "Equestrian", "Pegasus": "Sky Knight", "Drake": "Drake Knight"}
"Cavalry"={"Horse": "Cavalry", "Pegasus": "Flier", "Drake": "Drake Lancer"}
"Raider"={"Horse": "Raider", "Pegasus": "Sky Raider", "Drake": "Drake Raider"}
"Nomad"={"Horse": "Nomad", "Pegasus": "Sky Archer", "Drake": "Drake Archer"}
"Battlemage"={"Horse": "Battlemage", "Pegasus": "Sky Mage", "Drake": "Drake Mage"}
"Gendarme"={"Horse": "Gendarme", "Pegasus": "Whitewing", "Drake": "Drake Lord"}
"Warlord"={"Horse": "Warlord", "Pegasus": "Storm Rider", "Drake": "Wyrm Warlord"}
"Hussar"={"Horse": "Hussar", "Pegasus": "Sky Hussar", "Drake": "Drake Hussar"}
"Spellknight"={"Horse": "Spellknight", "Pegasus": "Sky Sage", "Drake": "Drake Sage"}

[names]
list=[
	"Bayard", "Arion", "Marengo", "Copper", "Thistle", "Gale", "Ember", "Juniper", "Shadowfax", "Bramble",
	"Duchess", "Pepper", "Comet", "Willow", "Sable", "Fenwick"
]
