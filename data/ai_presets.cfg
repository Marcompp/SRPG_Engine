; Enemy behavior presets: settings documented in scripts/ai_profiles.gd.

[charger]
move="charge"

[ambusher]
move="in_range"

[boss]
move="hold"
caution=0.0

[turret]
move="hold"

[sentry]
move="guard"
guard_radius=3

[sleeper]
move="hold"
wake={"in_threat": true, "attacked": true}

[reinforcement]
move="hold"
wake={"turn": 3}

[coward]
retreat_below=0.5

[thief]
move="goto"
attack=false
loot=true

; Follows the player's Lord (or its "target") and never attacks: with an objective's
; "caught_by", reaching the Lord loses the map (the Royal Guard).
[pursuer]
move="follow"
attack=false
breaks=false
