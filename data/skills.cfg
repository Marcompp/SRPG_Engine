; Skills: effect keys documented in scripts/skills.gd, design in docs/skills.md.

; Commands.
[Dance]
description="Dance: refresh an adjacent ally that has already acted. Dancing a dancer is a Duet: it refreshes every ally next to either of them (chaining through other dancers), but not the dancers."
command="dance"

[Inspire]
description="Inspire: every adjacent ally gets +STR/DEF until your next phase (+1, plus 1 every 5 levels)."
command="inspire"

[Steal]
description="Steal: take an item (not a weapon) from an adjacent foe with lower AGI."
command="steal"

[Lockpick]
description="Opens chests and doors without a key."

; Terrain movement.
[Forester]
description="Moves through forests (1.5 MOV) and thickets (6) more easily."
terrain_costs={"F": 1.5, "#": 6}

[Climbing]
description="Crosses hills (2 MOV) and mountains (4) more easily."
terrain_costs={"h": 2, "M": 4}

[Swimming]
description="Wades rivers, lakes and the sea (2 MOV) and can get past waterfalls (6)."
terrain_costs={"~": 2, "L": 2, "W": 2, "v": 6}

[Sea Legs]
description="+15 Hit on water."
battle={"hit": 15}
if={"terrain": ["~", "L", "W", "v"]}

[Ambush]
description="+15 Hit in forests and thickets."
battle={"hit": 15}
if={"terrain": ["F", "#"]}

[Highlander]
description="+15 Hit on hills and mountains."
battle={"hit": 15}
if={"terrain": ["h", "M"]}

[Open Ground]
description="+10 Avo on open terrain (plains, paths, sand, snow, floors, bridges)."
battle={"avo": 10}
if={"terrain": [".", "=", "S", "*", "_", "c", "B"]}

[Footwork]
description="Can move again after Dancing, with the MOV it has left."
map=["footwork"]

; Mount skills.
[Loyal]
description="Mount skill: takes a fatal blow once. The mount falls; the rider stays on the map on foot, at 1 HP."

[Prayer]
description="Adjacent allies recover 10% of max HP at the start of each turn."
turn_start={"heal_allies": 0.1}

; Racial attacks (see Spells "ability").
[Fire Breath]
description="Fire Breath: a fire attack at range 1-2 (STR + 6 against DEF, 80 Hit). No MP."
abilities=["Fire Breath"]

; Racial traits.
[Adaptable]
description="Earns 10% more EXP."
exp=1.1

[Regeneration]
description="Recovers 10% of max HP at the start of each turn."
turn_start={"heal": 0.1}

[Mana Flow]
description="Recovers 1 extra MP at the start of each turn."
turn_start={"mp": 1}

[Poison Immunity]
description="Immune to poison."
immune=["Poison"]

; Stat skills.
[Celerity]
description="+1 MOV."
stats={"mov": 1}

[Strength +2]
description="+2 STR."
stats={"str": 2}

[Magic +2]
description="+2 INT."
stats={"int": 2}

[Skill +2]
description="+2 DEX."
stats={"dex": 2}

[Skill +4]
description="+4 DEX."
stats={"dex": 4}

[Max HP +5]
description="+5 max HP."
stats={"hp": 5}

[Max MP +5]
description="+5 max MP."
stats={"mp": 5}

[Brawn]
description="Weapons weigh 5 less for it."
weight_relief=5

[Speed +2]
description="+2 AGI."
stats={"agi": 2}

[Luck +4]
description="+4 LCK."
stats={"lck": 4}

[Defense +2]
description="+2 DEF."
stats={"def": 2}

; Combat modifiers.
[Wrath]
description="+30 Crit at or below half HP."
battle={"crit": 30}
if={"hp_below": 0.5}

[Crit +20]
description="+20 Crit."
battle={"crit": 20}

[Impale]
description="+25 Crit against mounted foes (horses and fliers)."
battle={"crit": 25}
if={"foe_tag": ["horse", "flying"]}

[Evasion]
description="+10 Avo."
battle={"avo": 10}

[Warding]
description="+5 magic defense."
battle={"res": 5}

[Bow Range +1]
description="+1 max range with bows."
range={"bow": 1}

[Spell Range +1]
description="+1 max range for spells."
range={"spell": 1}

[Death Blow]
description="+6 Atk when initiating combat."
battle={"atk": 6}
if={"initiating": true}

[Darting Blow]
description="+5 AS when initiating combat."
battle={"as": 5}
if={"initiating": true}

[Armored Blow]
description="+6 DEF when initiating combat."
battle={"def": 6}
if={"initiating": true}

[Steady Stance]
description="+4 DEF when attacked."
battle={"def": 4}
if={"defending": true}

[Swordbreaker]
description="+50 Hit and Avo against swords."
battle={"hit": 50, "avo": 50}
if={"foe_weapon_type": "sword"}

[Axebreaker]
description="+50 Hit and Avo against axes."
battle={"hit": 50, "avo": 50}
if={"foe_weapon_type": "axe"}

[Spearbreaker]
description="+50 Hit and Avo against spears."
battle={"hit": 50, "avo": 50}
if={"foe_weapon_type": "spear"}

[Bowbreaker]
description="+50 Hit and Avo against bows."
battle={"hit": 50, "avo": 50}
if={"foe_weapon_type": "bow"}

; Strike order and counters.
[Vantage]
description="Strikes first when attacked at or below half HP."
rules=["vantage"]
if={"defending": true, "hp_below": 0.5}

[Desperation]
description="At or below half HP, its follow-up comes right after its first strike, before the counter."
rules=["desperation"]
if={"initiating": true, "hp_below": 0.5}

[Quick Riposte]
description="Always strikes twice when attacked at or above half HP."
rules=["quick_riposte"]
if={"defending": true, "hp_above": 0.5}

[Wary Fighter]
description="Neither side can strike twice in its fights."
rules=["wary_fighter"]

[Dazzle]
description="Foes can't counter its attacks."
rules=["no_counter"]

[Close Counter]
description="Counters at any range when armed."
rules=["counter_any"]

; Procs.
[Luna]
description="DEX% chance to ignore half the foe's DEF."
proc={"on": "attack", "rate": "dex", "effect": "pierce", "value": 0.5}

[Sol]
description="DEX% chance to heal HP equal to the damage dealt."
proc={"on": "attack", "rate": "dex", "effect": "drain", "value": 1.0}

[Lethality]
description="DEX/4% chance to defeat the foe in one blow."
proc={"on": "attack", "rate": "dex/4", "effect": "lethal"}

[Pavise]
description="DEX% chance to halve damage from adjacent foes."
proc={"on": "defend", "rate": "dex", "effect": "reduce", "value": 0.5}
if={"range": [1, 1]}

[Aegis]
description="DEX% chance to halve damage from foes at range."
proc={"on": "defend", "rate": "dex", "effect": "reduce", "value": 0.5}
if={"range": [2, 99]}

[Miracle]
description="LCK% chance to survive a lethal blow with 1 HP (needs more than 1 HP)."
proc={"on": "defend", "rate": "lck", "effect": "survive"}

; After combat.
[Lifetaker]
description="Recovers 50% of max HP after defeating a foe it attacked."
after_combat={"effect": "heal", "value": 0.5}
if={"initiating": true, "killed": true}

[Galeforce]
description="Can act again after defeating a foe it attacked (once per turn)."
after_combat={"effect": "refresh"}
if={"initiating": true, "killed": true}

[Poison Strike]
description="A foe it attacks loses 20% of max HP after combat (never below 1)."
after_combat={"effect": "damage_foe", "value": 0.2}
if={"initiating": true}

[Envenom]
description="A foe it attacks is poisoned after combat, if still standing."
after_combat={"effect": "inflict", "value": "Poison"}
if={"initiating": true}

; Weapon traits (see WeaponTraits): earned by weapons, also usable as skills.
[Armorbane]
description="+5 Atk against armored foes."
battle={"atk": 5}
if={"foe_tag": "heavy"}

[Horsebane]
description="+5 Atk against horseback foes."
battle={"atk": 5}
if={"foe_tag": "horse"}

[Skybane]
description="+5 Atk against flying foes."
battle={"atk": 5}
if={"foe_tag": "flying"}

[Wyrmbane]
description="+5 Atk against reptiles and dragons."
battle={"atk": 5}
if={"foe_tag": "reptile"}

[Grimbane]
description="+5 Atk against the undead and spirits."
battle={"atk": 5}
if={"foe_tag": ["undead", "spirit"]}

[Faebane]
description="+5 Atk against the fae."
battle={"atk": 5}
if={"foe_tag": "fae"}

[Orcbane]
description="+5 Atk against greenskins."
battle={"atk": 5}
if={"foe_tag": "greenskin"}

[Tidebane]
description="+5 Atk against aquatic foes."
battle={"atk": 5}
if={"foe_tag": "aquatic"}

[Woodsplitter]
description="+5 Atk against wooden foes."
battle={"atk": 5}
if={"foe_tag": "wooden"}

[Far Shot]
description="+15 Hit at range 2 or more."
battle={"hit": 15}
if={"range": [2, 99]}

[Savage Blow]
description="Foes within 2 tiles of the one it attacks lose 20% of max HP (never below 1)."
after_combat={"effect": "damage_near_foe", "value": 0.2}
if={"initiating": true}

; Turn start.
[Renewal]
description="Recovers 30% of max HP at the start of each turn."
turn_start={"heal": 0.3}

; Movement.
[Pass]
description="Can move through enemies."
map=["pass"]

[Pathfinder]
description="Every tile it can enter costs 1 MOV."
map=["pathfinder"]

[Canto]
description="Can move again after acting, with the MOV it has left."
map=["canto"]

; Auras.
[Charisma]
description="Allies within 3 tiles get +10 Hit and Avo."
aura={"radius": 3, "affects": "allies", "battle": {"hit": 10, "avo": 10}}

[Anathema]
description="Foes within 3 tiles get -10 Avo and Crit avoid."
aura={"radius": 3, "affects": "enemies", "battle": {"avo": -10, "crit_avo": -10}}

[Fortify]
description="Allies within 1 tile get +2 DEF in combat."
aura={"radius": 1, "affects": "allies", "battle": {"def": 2}}

; EXP and growth.
[Paragon]
description="Earns double EXP."
exp=2.0

[Aptitude]
description="+20% to every growth rate."
growths={"all": 20}

; Adjacency.
[Solo Fighter]
description="+10 Hit and Avo with no ally next to it."
battle={"hit": 10, "avo": 10}
if={"no_adjacent_ally": true}
