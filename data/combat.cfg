; triangle: the weapon triangle (key beats value; bows and staves sit outside it).
; tag_traits: weapon types and elements each effectiveness tag is weak to or resists.

[triangle]
sword="axe"
axe="spear"
spear="sword"

[tag_traits]
aquatic={"weak": ["spear", "lightning"], "resist": ["fire", "water"]}
reptile={"weak": ["ice"], "resist": ["fire"]}
wooden={"weak": ["axe", "fire", "ice"], "resist": ["water", "earth"]}
undead={"weak": ["silver", "fire", "light"], "resist": ["dark"]}
