; Consumables and held items: fields documented in scripts/items.gd.

[Potion]
kind="heal"
heal=15
uses=3

[Ether]
kind="mp"
mp=15
uses=3

[Antitoxin]
kind="cure"
cures="Poison"
uses=3

[Panacea]
kind="cure"
uses=1

; Opens a chest (one use per chest). Rogue-movement units open chests without one.
[Chest Key]
kind="key"
uses=1

[Repair Kit]
kind="repair"
uses=2

[Celerity Scroll]
kind="scroll"
skill="Celerity"
uses=1

[Vigor Scroll]
kind="scroll"
skill="Strength +2"
uses=1

; Held items with skills.
[Power Ring]
kind="ring"
skills=["Strength +2"]

[Speed Ring]
kind="ring"
skills=["Speed +2"]
