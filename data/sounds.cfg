; Music and sound effects (see scripts/sound.gd). Each key is a name the game or an
; event (@music, @sound) plays; its value is a file under res://audio/, or a
; dictionary for more: {"file": "...", "volume": -6.0 (dB, default 0), "loop": false
; (music loops by default; effects never do)}. An effect can also be an array of
; those, one picked at random each time, so a sound heard often doesn't repeat
; exactly. A name whose file isn't there yet plays nothing, so the game can call
; every sound before it exists.

; Tracks. The battle plays "<side>_phase" when that side's phase starts (a map can
; pick others with its "music" key), "victory" or "defeat" at the end.
[music]
title="music/title.ogg"
prep="music/prep.ogg"
player_phase="music/player_phase.ogg"
enemy_phase="music/enemy_phase.ogg"
ally_phase="music/ally_phase.ogg"
other_phase="music/other_phase.ogg"
neutral_phase="music/neutral_phase.ogg"
victory="music/victory.ogg"
defeat={"file": "music/defeat.ogg", "loop": false}

[effects]
; Menus and the map cursor
; Recorded louder than the other menu sounds
cursor={"file": "effects/cursor.wav", "volume": -8.0}
; Picking something on the map (a unit, a tile, a target)
select="effects/select.ogg"
; Choosing a menu option
confirm="effects/confirm.ogg"
cancel="effects/cancel.wav"
; Pressing confirm on something that can't be picked (out of reach, can't go there)
invalid="effects/invalid.ogg"
; Combat
hit="effects/hit.wav"
crit="effects/crit.wav"
miss=["effects/miss_1.wav", "effects/miss_2.wav", "effects/miss_3.wav"]
death="effects/death.wav"
spell="effects/spell.wav"
heal="effects/heal.wav"
status="effects/status.wav"
break="effects/break.wav"
; Rewards and flow
item="effects/item.wav"
level_up="effects/level_up.wav"
phase="effects/phase.wav"
; Dialogue, while a line types out
text="effects/text.wav"
