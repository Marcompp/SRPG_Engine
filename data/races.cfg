; Races: fields documented in scripts/races.gd, design in docs/races.md.
; caps and growths follow the stat tendencies in docs/races.md, with these steps
; (picked during implementation, change freely): caps ++ +3, + +2, - -2, -- -3,
; except HP (++ +10, + +5, - -5, -- -10) and MP (++ +6, + +3, - -3, -- -6);
; growths ++ +10, + +5, - -5, -- -10.

[Human]
skills=["Adaptable"]
description="Adaptable: earns 10% more EXP."

[Orc]
tags=["greenskin"]
skills=["Poison Immunity"]
caps={"hp": 5, "mp": -3, "str": 2, "int": -2}
growths={"hp": 5, "mp": -5, "str": 5, "int": -5}
description="Greenskin. Immune to poison."

[Troll]
skills=["Regeneration", "Poison Immunity"]
caps={"hp": 5, "mp": -3, "str": 2, "int": -2}
growths={"hp": 5, "mp": -5, "str": 5, "int": -5}
description="Regenerates 10% HP every turn. Immune to poison."

[Elf]
tags=["fae"]
caps={"hp": -5, "mp": 6, "int": 3, "dex": 3, "agi": 3, "def": -2}
growths={"hp": -5, "mp": 10, "int": 10, "dex": 10, "agi": 10, "def": -5}
description="Fae."

[Fairy]
tags=["fae"]
skills=["Winged", "Wellspring"]
caps={"mp": 6, "int": 3, "agi": 3, "def": -2}
growths={"mp": 10, "int": 10, "agi": 10, "def": -5}
description="Winged: flies unless mounted, and counts as a flier. Fae. Recovers 15% of max MP every turn."

[Naga]
tags=["reptile"]
skills=["Aquatic"]
banned=["mounted"]
description="Aquatic: moves through water, and is weak to spears and Lightning but resists Fire and Water. Reptile: weak to Ice. Can't ride."

[Lizal]
tags=["reptile"]
amphibious=true
skills=["Poison Immunity"]
caps={"mp": -3, "int": -2, "agi": 2}
growths={"mp": -5, "int": -5, "agi": 5}
description="Amphibious: swims and climbs in foot and scout classes. Reptile: weak to Ice, resists Fire. Immune to poison."

[Centaur]
skills=["Equine"]
banned=["flying"]
description="Equine: always moves and counts as a horse, +1 MOV in foot and scout classes. Can Rescue and Shove; can't be Rescued or Shoved. Can't fly."

[Minotaur]
tags=["horse"]
banned=["mounted"]
caps={"hp": 5, "str": 2}
growths={"hp": 5, "str": 5}
description="Half-Equine: counts as a horse. Can't ride."

[Dragon]
tags=["reptile"]
skills=["Winged", "Fire Breath"]
description="Winged: flies unless mounted, and counts as a flier. Reptile: weak to Ice, resists Fire. Breathes fire (Fire Breath)."

[Harpy]
skills=["Winged"]
banned=["heavy"]
caps={"agi": 2, "def": -2}
growths={"agi": 5, "def": -5}
gender_ratio={"female": 70, "male": 30}
description="Winged: flies unless mounted, and counts as a flier. Can't wear heavy armor."

[Ent]
skills=["Wooden Body"]
only=["foot", "heavy"]
caps={"hp": 10, "agi": -3, "def": 3}
growths={"hp": 10, "agi": -10, "def": 10}
gender_ratio={"none": 1}
description="Wooden Body: always moves as heavy armor, can't be Rescued or Shoved. Weak to axes, Fire and Ice; resists Water and Earth. Foot and armor classes only."

[Stoneborn]
skills=["Stone Body", "Poison Immunity"]
only=["foot", "heavy"]
caps={"hp": 10, "agi": -3, "def": 3}
growths={"hp": 10, "agi": -10, "def": 10}
gender_ratio={"none": 1}
description="Stone Body: always moves and counts as heavy armor, can't be Rescued or Shoved. Immune to poison. Foot and armor classes only."

[Skeleton]
tags=["undead"]
skills=["Poison Immunity"]
caps={"hp": -5, "dex": -2, "lck": -3}
growths={"hp": -5, "dex": -5, "lck": -10}
description="Undead: weak to silver, Fire and Light; resists Dark. Immune to poison."

[Ghost]
tags=["undead"]
skills=["Spirit", "Poison Immunity"]
caps={"hp": -5, "str": -2, "dex": -2, "lck": -3, "def": -3}
growths={"hp": -5, "str": -5, "dex": -5, "lck": -10, "def": -10}
description="Undead: weak to silver, Fire and Light; resists Dark. Spiritual: always moves and counts as a spirit. Immune to poison."
