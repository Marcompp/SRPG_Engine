; Placeholder class icons, until there are map sprites: 7x7 pixels, "#" drawn and
; "." empty. A class picks one with "icon" (classes.cfg); classes without one show
; their unit's initial. Drawn white with a dark shadow on the map token, and scaled
; up on the status screen's portrait.

[sword]
pixels=["......#", ".....#.", "....#..", "#..#...", ".##....", ".##....", "#..#..."]

