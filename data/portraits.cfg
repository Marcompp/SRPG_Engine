; Portraits: how parts stack and which colors they're drawn in (design:
; docs/portraits.md, code: scripts/portraits.gd). The parts themselves are drawn in
; art/portraits/*.ase and exported by tools/portrait_exporter.gd into
; portraits/parts/; the ramps to paint with are in portrait_ramps.cfg.

[stack]
; Back to front. A "slot:piece" entry places that piece of the slot (hair:back
; behind the head); other pieces go where their slot is.
order=["hair:back", "head", "neck", "clothes:back", "jaw", "clothes", "nose", "mouth", "marks", "eyes",
	"brows", "facial_hair", "hair", "ears", "hat", "accessory"]
; Slots a portrait can leave empty.
optional=["ears", "marks", "facial_hair", "hair", "hat", "accessory"]

[roles]
; What a pixel can be: a role and a shade (0 darkest .. 3 lightest). Art is drawn
; in the role's "keys", one color per shade; each must be unique.
;   family: the portrait_ramps.cfg section it paints from (default: the role's name)
;   default: its ramp when a recipe doesn't pick one (default: the family's first)
;   sides:  in a part's "left" and "right" pieces it becomes <role>_l / <role>_r, so
;           each eye can have its own colors (a recipe that doesn't pick them uses
;           the shared role's)
;   fixed:  never recolored (the outline)
outline={"keys": ["222034"], "fixed": true}
skin={"keys": ["705858", "c87038", "f0a058", "f8e3bb"]}
iris={"keys": ["305098", "2068d8", "4888f8", "98d0e0"], "sides": true}
sclera={"keys": ["5c6474", "7c8c9c", "9badb7", "f0f8f8"], "sides": true}
hair={"keys": ["584160", "787860", "a0b068", "c0d858"]}
cloth1={"keys": ["485078", "586098", "6880c0", "90a8e0"], "family": "cloth", "default": "blue"}
cloth2={"keys": ["696f96", "a0b8d8", "d0e0f0", "f8f8f8"], "family": "cloth", "default": "white"}
cloth3={"keys": ["404820", "606838", "789838", "a8c058"], "family": "cloth", "default": "moss"}
trim={"keys": ["806020", "c0b888", "f8d848", "f8f0a0"], "family": "metal", "default": "gold"}
trim2={"keys": ["505860", "8890a0", "c0c8d0", "e8f0f8"], "family": "metal", "default": "silver"}
accent={"keys": ["802050", "b03070", "e05090", "f8a0c8"], "family": "cloth", "default": "crimson"}

[slots]
; Per slot, all optional:
;   x, y, spacing: [min, max] the random generator picks offsets from (the editor
;           goes further). spacing moves the left and right pieces apart (+) or
;           together (-).
;   follows: moves with that slot (brows with the eyes, spacing included)
;   cast_shadow: Vector2i: the part's silhouette, moved this much, darkens what's
;           under it by one shade
;   masks:  slots its "mask" pieces erase (default: all of them)
eyes={"y": [-2, 1], "spacing": [-1, 1]}
brows={"follows": "eyes", "y": [-1, 0]}
nose={"y": [-1, 1]}
mouth={"y": [-1, 1]}
hair={"cast_shadow": Vector2i(1, 2)}
hat={"cast_shadow": Vector2i(1, 2), "masks": ["hair"]}
